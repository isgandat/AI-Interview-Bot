<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title if title else "AI Interview Bot" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div class="max-w-3xl mx-auto px-4 py-8">
      <header class="mb-6">
        <h1 class="text-2xl font-bold">AI Interview Bot</h1>
        <p class="text-sm text-slate-600">Practice interviews with automatic feedback.</p>
      </header>
      <main>
        {% block content %}{% endblock %}
      </main>
      <footer class="mt-8 text-xs text-slate-500">
        Running locally · Ollama model: <code>{{ env.get("AI_BOT_MODEL","llama3.1:8b") }}</code>
      </footer>
    </div>
  </body>
</html>
